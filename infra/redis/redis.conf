# ── Redis Configuration — Dynamic Pricing Engine ─────────────────────────────
# Optimised for:
#   • Low-latency stream writes (XADD sub-millisecond)
#   • High-throughput feature store reads/writes
#   • Memory-bounded operation with controlled eviction

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ── Persistence ───────────────────────────────────────────────────────────────
# RDB snapshots for recovery — AOF disabled for latency
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Disable AOF — stream data is ephemeral, we tolerate last-minute data loss
appendonly no

# ── Memory ────────────────────────────────────────────────────────────────────
# 512MB limit — evict LRU keys when full (never evict stream entries)
maxmemory 512mb
maxmemory-policy allkeys-lru

# ── Performance ───────────────────────────────────────────────────────────────
# Disable slow operations that would spike latency
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Faster response with no latency monitoring overhead in dev
latency-monitor-threshold 0
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Streams ───────────────────────────────────────────────────────────────────
# No explicit stream config needed — maxlen is set per XADD call (MAXLEN ~)

# ── Security ──────────────────────────────────────────────────────────────────
# In production: set requirepass and rename dangerous commands
# requirepass your-strong-password-here
# rename-command FLUSHALL ""
# rename-command FLUSHDB  ""
# rename-command DEBUG    ""
